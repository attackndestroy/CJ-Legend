<!DOCTYPE html>

    <title>أسطورة سيجي - ATT/DES</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0d0d0e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title Styling */
        .title {
            color: #ffcc00;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* Subtitle */
        .subtitle {
            color: #a0a0a0;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* Ad Units Wrapper */
        .ad-wrapper {
            width: 100%;
            margin: 15px 0;
        }

        /* Links / Buttons Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0;
        }

        /* Base Card Styling */
        .card {
            background-color: #1a1a1d;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border-right: 5px solid transparent;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        /* Border accents matching the screenshot */
        .card.youtube {
            border-right-color: #ff0000;
        }

        .card.telegram {
            border-right-color: #29a9eb;
        }

        .card.facebook {
            border-right-color: #1877f2;
        }

        /* Right side title & emoji inside card */
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Action Badge Buttons (Left side inside card) */
        .badge {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-youtube {
            background-color: #ff0000;
        }

        .badge-telegram {
            background-color: #29a9eb;
        }

        .badge-facebook {
            background-color: #1877f2;
        }

        /* Footer Copyright */
        .footer {
            color: #71717a;
            font-size: 0.85rem;
            margin-top: 10px;
        }
